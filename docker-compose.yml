# AGENTOS full stack with dummy values only. Nothing secret lives here.
# For real deployments, override via environment (see docs/DEPLOY.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: dummy-postgres-password
      POSTGRES_DB: agentos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://agentos:dummy-postgres-password@db:5432/agentos
      JWT_SECRET: dummy-jwt-secret-for-local-docker-only-32
      JWT_EXPIRE_MINUTES: 60
      CORS_ORIGINS: http://localhost:5173
      LLM_PROVIDER: groq
      LLM_MOCK: "true"
      LLM_CALLS_PER_HOUR: 60
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://127.0.0.1:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
