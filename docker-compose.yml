# AGENTOS local + Docker setup. No secrets live in this file;
# backend configuration comes from backend/.env (see backend/.env.example).
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: sqlite:////data/agentos.db
    volumes:
      - agentos-data:/data
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://127.0.0.1:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Optional Postgres. Default profile runs SQLite only; start Postgres with:
  #   docker compose --profile postgres up --build
  # then point the backend at it (see docs/ER_DIAGRAM.md + README Docker section):
  #   DATABASE_URL=postgresql+psycopg2://agentos:agentos@db:5432/agentos
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: agentos
      POSTGRES_DB: agentos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos"]
      interval: 5s
      retries: 5

volumes:
  agentos-data:
  pgdata:
