# AGENTOS CI: backend on SQLite + Postgres (mock LLM), frontend build.
# No secrets required: dummy values only. Postgres runs as a service container.
name: CI

on:
  push:
  pull_request:

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m app.ml.train
      - run: python -m pytest tests/ -q
        env:
          USE_MOCK_LLM: "true"
          SECRET_KEY: ci-dummy-secret-key-for-tests-only-32

  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos-ci-dummy-password
          POSTGRES_DB: agentos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      USE_MOCK_LLM: "true"
      SECRET_KEY: ci-dummy-secret-key-for-tests-only-32
      DATABASE_URL: postgresql+psycopg2://agentos:agentos-ci-dummy-password@localhost:5432/agentos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m app.ml.train
      - run: python -m alembic -c alembic.ini upgrade head
      - run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
